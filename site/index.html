<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Claimstake</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Zilla+Slab:wght@600;700&display=swap">
<style>/* Layout concept: dusk survey office. Header ribbon of ten stakes; left = town scene + action table; right = ledger, market, lots.
   Dark-first (dusk with lamplit windows); daylight theme mirrors it. */
:root {
  --bg: #0e1822; --bg2: #132130; --panel: #192a3a; --panel2: #213447; --line: #31485c;
  --ink: #ece6d6; --ink2: #a9b8c6; --ink3: #7189a0;
  --amber: #f2b34c; --amber2: #c98a22; --on-amber: #1d1406; --good: #8fc08a; --bad: #e0705a; --warn: #eab050;
  --R: #d9806a; --I: #8aa5c8; --C: #52b5aa; --S: #b88acb;
  --sky1: #1b2f4a; --sky2: #5a5476; --sky3: #e9985a; --hill1: #1a2b3c; --hill2: #142230; --ground: #263a30; --star: .0;
  --wall: #a58d6c; --wall2: #7b6850; --trim: #e4d6b8; --dk: #241c16; --glass: #ffcf72; --stone: #7f8c99; --stone2: #62707e;
  --brick: #98584b; --water: #2f6f8f; --plank: #6c5238; --crate: #9a7a4b; --grass: #4d6b46; --crop: #d1a944; --cow: #d9cdb5;
  --logc: #c6934f; --rock: #5d6670; --oreGold: #f0c040; --oreCu: #cf7a48; --steel2: #6f7e8e; --wheel: #d9cfb8; --smoke: #c4ccd4;
  --shadow: 0 6px 18px rgba(0, 0, 0, .35);
  --font-d: 'Zilla Slab', 'Rockwell', 'Roboto Slab', Georgia, serif;
  --font-b: 'Barlow Semi Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e7edf1; --bg2: #dde5eb; --panel: #f6f8fa; --panel2: #e6ecf1; --line: #bccad5;
    --ink: #1b2a36; --ink2: #44586a; --ink3: #6b8091; --amber: #d98b0a; --amber2: #a96a05; --on-amber: #1d1406;
    --good: #3f7f3a; --bad: #b8402d; --warn: #a96a05;
    --R: #c25f47; --I: #4f74a1; --C: #2a8f84; --S: #8a58a6;
    --sky1: #8fb4d6; --sky2: #f0cfae; --sky3: #ffe9c4; --hill1: #9db5a0; --hill2: #86a28d; --ground: #7aa077;
    --wall: #c7ad86; --wall2: #a38a66; --glass: #ffe3a1; --shadow: 0 6px 16px rgba(30, 50, 70, .18);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e7edf1; --bg2: #dde5eb; --panel: #f6f8fa; --panel2: #e6ecf1; --line: #bccad5;
  --ink: #1b2a36; --ink2: #44586a; --ink3: #6b8091; --amber: #d98b0a; --amber2: #a96a05; --on-amber: #1d1406;
  --good: #3f7f3a; --bad: #b8402d; --warn: #a96a05;
  --R: #c25f47; --I: #4f74a1; --C: #2a8f84; --S: #8a58a6;
  --sky1: #8fb4d6; --sky2: #f0cfae; --sky3: #ffe9c4; --hill1: #9db5a0; --hill2: #86a28d; --ground: #7aa077;
  --wall: #c7ad86; --wall2: #a38a66; --glass: #ffe3a1; --shadow: 0 6px 16px rgba(30, 50, 70, .18);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.35 var(--font-b); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, h4 { font-family: var(--font-d); margin: 0; font-weight: 700; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 1.25em; height: 1.25em; vertical-align: -.28em; flex: none; }
.ic.R, .ic.I, .ic.C, .ic.S { }
.ic.R { color: var(--R); } .ic.I { color: var(--I); } .ic.C { color: var(--C); } .ic.S { color: var(--S); }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 4px; }

#app { min-height: 100%; display: flex; flex-direction: column; padding-inline: 16px; padding-block: 10px 90px; max-width: 1480px; margin: 0 auto; gap: 10px; }

/* ---------- buttons, chips */
.btn { background: var(--amber); color: var(--on-amber); border: 0; border-radius: 6px; padding: 9px 16px; font-weight: 700; letter-spacing: .01em; min-height: 40px; box-shadow: 0 2px 0 var(--amber2); transition: transform .08s, filter .15s; }
.btn:hover:not(:disabled) { filter: brightness(1.07); }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: 0 1px 0 var(--amber2); }
.btn:disabled { background: var(--panel2); color: var(--ink3); box-shadow: none; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
.btn.ghost:hover:not(:disabled) { background: var(--panel2); }
.btn.small { padding: 4px 10px; min-height: 30px; font-size: 13px; }
.btn.warn { background: var(--bad); color: #fff; box-shadow: 0 2px 0 rgba(0, 0, 0, .3); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
.chip.R { border-color: var(--R); } .chip.I { border-color: var(--I); } .chip.C { border-color: var(--C); } .chip.S { border-color: var(--S); }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--ink2); }
.tag.confirmed { color: var(--good); border-color: var(--good); } .tag.designed { color: var(--warn); border-color: var(--warn); }
.muted { color: var(--ink2); } .faint { color: var(--ink3); }
.row { display: flex; align-items: center; gap: 8px; } .row.wrap { flex-wrap: wrap; } .grow { flex: 1; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.panel > h3 { font-size: 17px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }

/* ---------- header */
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-d); font-size: 24px; font-weight: 700; letter-spacing: .01em; }
.brand .ic { width: 28px; height: 28px; }
.ribbon { flex: 1; min-width: 260px; display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; align-items: end; }
.stake { position: relative; height: 30px; border-radius: 3px; background: var(--panel2); display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--ink3); border-bottom: 3px solid var(--line); }
.stake.A { border-bottom-color: #84b27e; } .stake.B { border-bottom-color: #7ea0c8; } .stake.C { border-bottom-color: #c590d6; }
.stake.done { color: var(--ink2); background: var(--bg2); }
.stake.now { background: var(--amber); color: var(--on-amber); transform: translateY(-3px); box-shadow: 0 3px 0 var(--amber2); }
.stagebar { grid-column: 1 / -1; display: grid; grid-template-columns: 4fr 4fr 2fr; font-size: 11px; color: var(--ink3); letter-spacing: .06em; text-transform: uppercase; }
.phase { font-family: var(--font-d); font-weight: 700; font-size: 17px; }
.iconbtn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 8px; background: transparent; border: 1px solid var(--line); }
.iconbtn:hover { background: var(--panel2); }

/* ---------- opponents */
.opps { display: flex; gap: 8px; flex-wrap: wrap; }
.opp { flex: 1; min-width: 190px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: grid; gap: 4px; }
.opp.turn { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber) inset; }
.opp .nm { font-family: var(--font-d); font-weight: 700; font-size: 16px; display: flex; justify-content: space-between; gap: 6px; }
.opp .st { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--ink2); }
.pips { display: inline-flex; gap: 3px; } .pips i { width: 9px; height: 9px; border-radius: 50%; background: var(--panel2); border: 1px solid var(--line); } .pips i.on { background: var(--amber); border-color: var(--amber2); }

/* ---------- main grid */
.main { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(300px, 1fr); gap: 12px; align-items: start; }
.col { display: grid; gap: 12px; min-width: 0; }

/* ---------- town scene */
.scene { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: linear-gradient(var(--sky1), var(--sky2) 62%, var(--sky3)); position: relative; box-shadow: var(--shadow); }
.scene svg.sc { display: block; width: 100%; height: auto; }
.scene .cap { position: absolute; left: 10px; top: 8px; right: 10px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
.scene .cap b { font-family: var(--font-d); font-size: 18px; color: #fff; text-shadow: 0 1px 6px rgba(0, 0, 0, .5); }
.scene .cap span { color: rgba(255, 255, 255, .85); font-size: 13px; text-shadow: 0 1px 4px rgba(0, 0, 0, .5); }
.star { fill: #fff; opacity: calc(var(--star) * .9); }
.bld { cursor: pointer; }
.bld:hover .spr { filter: brightness(1.12); }
.bld.rise { animation: rise .8s cubic-bezier(.2, .9, .25, 1.15) both; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes rise { 0% { transform: translateY(40px) scaleY(.2); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }
.spr { overflow: visible; }
.spr .w { fill: var(--wall); } .spr .w2 { fill: var(--wall2); } .spr .trim { fill: var(--trim); }
.spr .dk { fill: var(--dk); stroke: var(--dk); } .spr .gl { fill: var(--glass); filter: drop-shadow(0 0 2.5px var(--glass)); animation: flick 5s ease-in-out infinite; }
.spr .stone { fill: var(--stone); } .spr .stone2 { fill: var(--stone2); } .spr .brick { fill: var(--brick); }
.spr .rf.R, .spr .flag.R { fill: var(--R); } .spr .rf.I, .spr .flag.I { fill: var(--I); } .spr .rf.C, .spr .flag.C { fill: var(--C); } .spr .rf.S, .spr .flag.S { fill: var(--S); }
.spr .water { fill: var(--water); } .spr .wave { fill: none; stroke: rgba(255, 255, 255, .35); stroke-width: 1.4; }
.spr .plank { fill: var(--plank); } .spr .crate { fill: var(--crate); stroke: var(--dk); stroke-width: .8; } .spr .gr { fill: var(--grass); }
.spr .crop { fill: var(--crop); } .spr .cow { fill: var(--cow); } .spr .logc { fill: var(--logc); stroke: var(--dk); stroke-width: .8; }
.spr .rock { fill: var(--rock); } .spr .ore.gold { fill: var(--oreGold); } .spr .ore.copper { fill: var(--oreCu); } .spr .ore { fill: var(--stone); }
.spr .fence { fill: none; stroke: var(--wall2); } .spr .fence path, .spr .fence ellipse { stroke: var(--trim); }
.spr .track { fill: none; stroke: var(--steel2); stroke-width: 1.6; }
.spr .anvilc { fill: var(--steel2); } .spr .wheel { fill: none; stroke: var(--wheel); } .spr .sail { fill: var(--trim); }
.spr .awn0 { fill: var(--R); } .spr .awn1 { fill: var(--trim); } .spr .stripe { stroke: var(--bg); opacity: .5; fill: none; }
.spr .sign { fill: var(--trim); } .spr .sign2 { fill: var(--trim); }
.spr .boxA { fill: var(--R); } .spr .boxB { fill: var(--C); }
.spr .fire { fill: #ff9b3d; filter: drop-shadow(0 0 4px #ff9b3d); animation: flick 1.4s ease-in-out infinite; }
.spr .blade { fill: none; stroke: var(--wall2); } .spr .blade2 { fill: var(--trim); opacity: .9; }
.spr .spin { animation: spin 14s linear infinite; }
.spr .smoke circle { fill: var(--smoke); opacity: .0; animation: puff 4.5s ease-out infinite; }
.spr .smoke circle:nth-child(2) { animation-delay: .6s; } .spr .smoke circle:nth-child(3) { animation-delay: 1.2s; }
@keyframes flick { 0%, 100% { opacity: 1; } 45% { opacity: .85; } 52% { opacity: 1; } 78% { opacity: .9; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes puff { 0% { opacity: .0; transform: translateY(6px); } 25% { opacity: .55; } 100% { opacity: 0; transform: translateY(-14px) scale(1.5); } }

/* ---------- action table */
.table { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 12px; }
.table > .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.table > .hd h2 { font-size: 22px; }
.hint { color: var(--ink2); font-size: 14px; max-width: 70ch; }
.notice { border-left: 4px solid var(--amber); background: var(--panel2); border-radius: 6px; padding: 8px 10px; font-size: 14px; }
.notice.bad { border-color: var(--bad); }

/* auctions */
.aucs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.auc { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; align-content: start; position: relative; }
.auc.mine { border-color: var(--amber); }
.auc .tn { font-family: var(--font-d); font-weight: 700; font-size: 18px; }
.auc .bidnow { display: flex; align-items: center; gap: 8px; min-height: 34px; }
.coin { display: inline-grid; place-items: center; min-width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3d0, var(--amber) 55%, var(--amber2)); color: var(--on-amber); font-weight: 800; font-size: 16px; box-shadow: 0 2px 0 var(--amber2); }
.coin.neutral { background: radial-gradient(circle at 35% 30%, #e8eef3, #95a6b6 60%, #6d7f90); box-shadow: 0 2px 0 #55687a; }
.coin.stamp { animation: stamp .35s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes stamp { 0% { transform: scale(2) rotate(-14deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
.ladder { display: flex; flex-wrap: wrap; gap: 5px; }
.lad { min-width: 40px; height: 36px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); font-weight: 700; }
.lad:hover:not(:disabled) { background: var(--amber); color: var(--on-amber); border-color: var(--amber2); }
.lad:disabled { opacity: .35; cursor: not-allowed; }
.mini { display: flex; flex-wrap: wrap; gap: 5px; }
.mb { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 4px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; cursor: pointer; }
.mb svg.spr { width: 28px; height: 25px; }
.mb.no { opacity: .5; } .mb.ok { border-color: var(--good); }
.mb:hover { background: var(--bg2); }

/* building cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.bcard { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; gap: 6px; align-content: start; position: relative; text-align: left; }
.bcard.sel { border-color: var(--amber); box-shadow: 0 0 0 2px var(--amber) inset; }
.bcard.dis { opacity: .55; }
.bcard .art { height: 64px; display: flex; justify-content: center; background: linear-gradient(var(--sky1), var(--sky2)); border-radius: 7px; overflow: hidden; }
.bcard .art svg { height: 100%; width: auto; }
.bcard .nm { font-family: var(--font-d); font-weight: 700; font-size: 16px; display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.bcard .fx { font-size: 13px; color: var(--ink2); display: grid; gap: 2px; }
.cost { display: inline-flex; gap: 2px; align-items: center; }
.ty { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; }
.slots { display: flex; gap: 8px; flex-wrap: wrap; }
.slot { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px; border-radius: 8px; border: 1px dashed var(--line); background: var(--panel); font-size: 13px; min-height: 36px; cursor: pointer; }
.slot:hover { border-color: var(--amber); }
.slot .w { width: 20px; height: 20px; border-radius: 50%; border: 2px dashed var(--ink3); display: inline-grid; place-items: center; }
.slot .w.on { border: 2px solid var(--amber); background: var(--amber); }
.slot .w.on svg { width: 16px; height: 16px; }
.slot.full { border-style: solid; border-color: var(--amber); }

/* resource lines */
.resrow { display: grid; grid-template-columns: 1.6em minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.resrow:last-child { border-bottom: 0; }
.resrow .have { font-weight: 800; font-size: 17px; min-width: 1.5em; text-align: right; }
.mk { display: inline-flex; gap: 4px; }
.mk button { border: 1px solid var(--line); background: var(--panel2); border-radius: 6px; padding: 3px 7px; font-size: 13px; font-weight: 700; min-height: 30px; }
.mk button:hover:not(:disabled) { background: var(--amber); color: var(--on-amber); }
.mk button:disabled { opacity: .35; cursor: not-allowed; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 6px; }
.stat { background: var(--panel2); border-radius: 8px; padding: 6px 8px; display: grid; gap: 1px; }
.stat b { font-size: 20px; font-family: var(--font-d); display: flex; align-items: center; gap: 5px; }
.stat span { font-size: 12px; color: var(--ink2); }
.stat.bad b { color: var(--bad); }

.tabs { display: none; }
.log { max-height: 220px; overflow: auto; font-size: 13px; color: var(--ink2); display: grid; gap: 2px; }
.log div:last-child { color: var(--ink); font-weight: 600; }
.lots .grp { display: grid; gap: 4px; margin-bottom: 8px; }
.lotrow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 3px 4px; border-radius: 6px; cursor: pointer; background: transparent; border: 0; text-align: left; width: 100%; }
.lotrow:hover { background: var(--panel2); }
.lotrow svg.spr { width: 36px; height: 32px; }
.lotrow .era { font-size: 11px; color: var(--ink3); }

/* pay panel */
.pay { background: var(--panel2); border: 1px solid var(--amber); border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
.pay .due { font-family: var(--font-d); font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.stepper button { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); font-weight: 800; }
.stepper button:disabled { opacity: .35; }

/* modal / curtain / toast */
.veil { position: fixed; inset: 0; background: rgba(5, 10, 16, .66); display: grid; place-items: center; padding: 16px; z-index: 50; overflow: auto; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; max-width: 760px; width: 100%; max-height: calc(100% - 20px); overflow: auto; display: grid; gap: 12px; box-shadow: var(--shadow); }
.sheet.wide { max-width: 1000px; }
.curtain { background: var(--bg); z-index: 80; text-align: center; }
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; z-index: 70; pointer-events: none; width: min(92vw, 460px); }
.toast { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; box-shadow: var(--shadow); animation: tin .25s ease-out both; font-weight: 600; }
.toast.bad { border-color: var(--bad); } .toast.good { border-color: var(--good); }
@keyframes tin { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

/* menu */
.hero { display: grid; gap: 14px; place-items: center; text-align: center; padding-block: 18px; }
.hero h1 { font-size: clamp(40px, 8vw, 74px); letter-spacing: .01em; line-height: 1; }
.hero p { max-width: 54ch; color: var(--ink2); margin: 0; font-size: 17px; }
.hero .scene { width: min(100%, 880px); }
.menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; align-items: start; }
.field { display: grid; gap: 4px; } .field label { font-weight: 700; font-size: 14px; }
select, input[type=text] { background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; font: inherit; min-height: 38px; width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--panel2); border: 0; padding: 7px 14px; font-weight: 700; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--amber); color: var(--on-amber); }
.opt { display: grid; gap: 3px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.opt:last-child { border-bottom: 0; }
details.fold { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--panel); }
details.fold > summary { cursor: pointer; font-family: var(--font-d); font-weight: 700; font-size: 17px; }
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
.ach div { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 13px; background: var(--panel2); }
.ach div.got { border-color: var(--amber); } .ach div:not(.got) { opacity: .55; }
.ach b { display: block; font-family: var(--font-d); font-size: 15px; }

/* scoring */
.scoretbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.scoretbl th, .scoretbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: top; }
.scoretbl th:first-child, .scoretbl td:first-child { text-align: left; }
.scoretbl tr.total td { font-family: var(--font-d); font-size: 20px; font-weight: 700; }
.scoretbl td.win { color: var(--amber); }
.tblwrap { overflow-x: auto; }
.banner { text-align: center; font-family: var(--font-d); font-size: clamp(26px, 5vw, 40px); font-weight: 700; }
.conf i { position: fixed; top: -10px; width: 8px; height: 14px; animation: fall linear forwards; z-index: 90; pointer-events: none; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

@media (max-width: 960px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  #app { padding-bottom: 96px; }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 40; }
  .tabs button { background: transparent; border: 0; padding: 10px 4px 8px; font-weight: 700; color: var(--ink2); border-top: 3px solid transparent; }
  .tabs button.on { color: var(--amber); border-top-color: var(--amber); }
  .pane { display: none; } .pane.on { display: grid; gap: 12px; }
  .toasts { bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
}
@media (min-width: 961px) { .pane { display: grid; gap: 12px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.stat b span { font-size: inherit; color: inherit; }
.seg { justify-self: start; }

/* hover tooltips */
.tip { position: fixed; z-index: 120; max-width: 320px; background: var(--panel); color: var(--ink); border: 1px solid var(--amber); border-radius: 10px; padding: 9px 11px; box-shadow: var(--shadow); font-size: 13.5px; line-height: 1.35; pointer-events: none; display: grid; gap: 5px; left: 0; top: 0; }
.tip[hidden] { display: none; }
.tip b { font-family: var(--font-d); font-size: 15px; }
.tip .tipcard { border: 0; padding: 0; background: transparent; }
.tip .tipcard .art { height: 56px; }
.tip .tipx { color: var(--ink2); }

/* rail track + reward buttons, larger */
.rtrack { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; max-width: 560px; }
.rcell { display: grid; justify-items: center; gap: 4px; padding: 10px 4px 8px; border-radius: 10px; background: var(--bg2); border: 2px solid var(--line); font-size: 13px; font-weight: 700; text-align: center; color: var(--ink2); line-height: 1.15; }
.rcell .ic { width: 44px; height: 44px; }
.rcell.done { opacity: .5; }
.rcell.now { border-color: var(--amber); background: var(--panel2); color: var(--ink); box-shadow: 0 0 0 2px var(--amber) inset; }
.rewards .btn.small { min-height: 48px; padding: 6px 14px; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
.rewards .btn.small .ic { width: 30px; height: 30px; }
.rewards .chip { padding: 6px 10px; font-size: 15px; gap: 8px; }
.rewards .chip .btn.small { min-height: 44px; padding: 4px 10px; }
.rewards .chip .btn.small .ic { width: 28px; height: 28px; }
@media (max-width: 520px) { .rcell .ic { width: 34px; height: 34px; } .rcell { font-size: 11.5px; } }

/* round dawn: fade in with a rising sun */
.dawnveil { position: fixed; inset: 0; z-index: 60; pointer-events: none; background: linear-gradient(to top, rgba(244, 150, 78, .55), rgba(9, 16, 30, .92) 62%); animation: dawnveil 1.7s ease-out both; animation-delay: var(--d); }
@keyframes dawnveil { 0% { opacity: 1; } 55% { opacity: .55; } 100% { opacity: 0; } }
.dawntitle { position: fixed; z-index: 61; left: 50%; top: 38%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; color: #fff7e0; text-shadow: 0 2px 14px rgba(0, 0, 0, .6); display: grid; gap: 2px; animation: dawntitle 2.2s ease-out both; animation-delay: var(--d); }
.dawntitle b { font-family: var(--font-d); font-size: clamp(40px, 9vw, 84px); line-height: 1; }
.dawntitle small { font-size: 16px; letter-spacing: .12em; text-transform: uppercase; }
@keyframes dawntitle { 0% { opacity: 0; transform: translate(-50%, -38%); } 22% { opacity: 1; transform: translate(-50%, -50%); } 68% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -56%); } }
.scene.dawn { animation: dawnsky 2.4s ease-out both; animation-delay: var(--d); }
@keyframes dawnsky { 0% { filter: brightness(.4) saturate(.5); } 100% { filter: none; } }
.sunwrap { animation: sunrise 2.4s cubic-bezier(.2, .7, .3, 1) both; animation-delay: var(--d); }
@keyframes sunrise { 0% { transform: translateY(150px); opacity: 1; } 70% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-8px); opacity: 0; } }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hero .cover { display: block; width: min(100%, 940px); height: auto; border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.hero .cover { width: auto; max-width: 100%; max-height: 64vh; }

.tc { display: inline-flex; align-items: center; gap: 1px; margin-left: 4px; font-size: 12px; font-weight: 800; color: var(--bad); }
.tc .ic { width: 15px; height: 15px; }
.mk button:hover:not(:disabled) .tc { color: inherit; }
.mk button:disabled .tc { color: inherit; }
.tnote { margin: 0 0 6px; font-size: 13px; }

/* buildings chart */
.sortbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.sortbar button { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font-size: 13px; font-weight: 700; min-height: 30px; }
.sortbar button:hover { border-color: var(--amber); }
.sortbar button.on { background: var(--amber); color: var(--on-amber); border-color: var(--amber2); }
.btable .seg button { padding: 5px 12px; }
.bt { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
.bt th { text-align: left; font-size: 12px; color: var(--ink3); font-weight: 700; padding: 4px 8px; border-bottom: 2px solid var(--line); white-space: nowrap; }
.bt td { padding: 6px 8px; border-bottom: 1px dashed var(--line); vertical-align: top; }
.bt tr { cursor: pointer; } .bt tbody tr:hover { background: var(--panel2); }
.bt tr.own td:first-child { box-shadow: 3px 0 0 var(--amber) inset; }
.bt .bn { display: flex; align-items: center; gap: 8px; font-weight: 700; min-width: 150px; font-family: var(--font-d); font-size: 14px; }
.bt .th { width: 46px; height: 41px; flex: none; background: linear-gradient(var(--sky1), var(--sky2)); border-radius: 6px; overflow: hidden; display: block; }
.bt .th svg { width: 100%; height: 100%; display: block; }
.bt td .chip { margin: 1px 2px 1px 0; font-size: 12px; }
.bt td div + div { margin-top: 2px; }
.bt td.num { font-variant-numeric: tabular-nums; font-weight: 700; }
@media (max-width: 960px) { .bt .th { display: none; } .bt { min-width: 720px; } }
.scene .wk { pointer-events: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }

.needs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 6px 0 2px; font-size: 13px; }
.nc { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel2); font-weight: 700; font-variant-numeric: tabular-nums; }
.nc .ic { width: 18px; height: 18px; }
.nc.ok { border-color: var(--good, #4a8); } .nc.short { border-color: var(--bad); color: var(--bad); }
.notice .needs { margin: 0 0 6px; }

/* market */
.mhead { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
.mbal { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.mbal .ml { font-size: 12px; color: var(--ink3); font-weight: 700; }
.mbal b { font-size: 24px; display: flex; align-items: center; gap: 6px; line-height: 1.1; }
.mbal .ic { width: 28px; height: 28px; }
.mrows { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 12px; }
.mrow { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.mrow.has { border-color: var(--amber); background: var(--panel2); }
.mico { width: 48px; height: 48px; border-radius: 10px; background: var(--panel2); display: grid; place-items: center; }
.mrow.has .mico { background: var(--panel); }
.mico .ic { width: 34px; height: 34px; vertical-align: 0; }
.minfo { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.minfo b { font-family: var(--font-d); font-size: 16px; }
.minfo .faint { font-size: 12px; }
.bar { display: block; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 3px; max-width: 120px; }
.bar u { display: block; height: 100%; background: var(--amber); text-decoration: none; }
.mhave { display: flex; flex-direction: column; align-items: center; min-width: 44px; line-height: 1.1; }
.mhave .num { font-size: 24px; font-weight: 800; } .mhave .faint { font-size: 11px; }
.mrow .mk { gap: 6px; }
.mrow .mk button { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 66px; min-height: 52px; padding: 5px 8px; border-radius: 8px; font-size: 12px; }
.mrow .mk .mv { font-size: 14px; font-weight: 800; }
.mrow .mk .mp { font-size: 13px; display: inline-flex; align-items: center; gap: 2px; }
.mrow .mk .mp .ic, .mrow .mk .tc .ic { width: 16px; height: 16px; }
.mrow .mk .tc { font-size: 11px; opacity: .85; display: inline-flex; align-items: center; }
.mxh { font-size: 13px; font-weight: 700; color: var(--ink3); margin-bottom: 4px; }
.market .btn.small { min-height: 38px; font-size: 14px; }
@media (max-width: 520px) { .mrow { grid-template-columns: 40px minmax(0, 1fr) auto; } .mhave { display: none; } .mico { width: 40px; height: 40px; } .mrow .mk button { min-width: 58px; } }

.goods-h { font-size: 13px; font-weight: 700; color: var(--ink3); margin: 10px 0 4px; }
.stats.goods .stat.zero { opacity: .5; }

    let n = 0; const d = new Date();
    for (let i = 0; i < 400; i++) {
      const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      if (prof.daily[k] != null) n++; else if (i > 0) break;
      d.setDate(d.getDate() - 1);
    }
    return n;
  }

  // ------------------------------------------------------------ html bits
  function resChip(r, q) { return `<span class="chip">${I(r)}<b class="num">${q}</b></span>`; }
  function outChips(o) {
    if (!o) return '';
    const parts = [];
    for (const k in o) {
      const v = o[k];
      if (k === 'silverPerWorker') parts.push(`<span class="chip">${I('silver')}1 per ${I('worker')}</span>`);
      else if (k === 'debtPay') parts.push(`<span class="chip">${I('debt')} repay ${v}</span>`);
      else if (k === 'rail') parts.push(`<span class="chip">${I('rail')} +${v}</span>`);
      else if (k === 'extra') parts.push('<span class="chip">extra building</span>');
      else if (k === 'resource') parts.push(`<span class="chip">any resource${v > 1 ? ' x' + v : ''}</span>`);
      else parts.push(`<span class="chip">${I(k)}<b class="num">${v}</b></span>`);
    }
    return parts.join('');
  }
  const typeChip = t => `<span class="chip ${t}">${I(t)}${D.TYPES[t]}</span>`;
  function costHTML(bd) { return bd.costList.length ? `<span class="cost">${bd.costList.map(r => I(r)).join('')}</span>` : '<span class="faint">Free</span>'; }
  function finalTxt(f) { return `+1 VP per ${PER[f.per]}${/^[RICS]$/.test(f.per) ? ' ' + I(f.per) : ''}`; }
  function bcard(id, o) {
    o = o || {}; const bd = BMAP[id];
    const L = [];
    if (bd.auto) L.push(`<div>Always: ${outChips(bd.auto)}</div>`);
    if (bd.s1) L.push(`<div>1 worker: ${outChips(bd.s1)}</div>`);
    if (bd.s2) L.push(`<div>1 worker: ${outChips(bd.s2)}</div>`);
    if (bd.dbl) L.push(`<div>2 workers: ${outChips(bd.dbl)}</div>`);
    if (bd.onBuild) L.push(`<div>When built: ${outChips(bd.onBuild)}</div>`);
    (bd.final || []).forEach(f => L.push(`<div>Final: ${finalTxt(f)}</div>`));
    if (bd.special) L.push(`<div class="faint">${SPECIAL[bd.special]}</div>`);
    const tag = o.tag || 'div';
    return `<${tag} class="bcard ${o.cls || ''}" ${o.attrs || ''}>
      <div class="art">${A.sprite(id)}</div>
      <div class="nm"><span>${bd.name}</span><span class="ty ${bd.type}">${I(bd.type)}${bd.type}</span></div>
      <div class="row wrap">${costHTML(bd)}${bd.pts ? `<span class="chip">${I('vp')}${bd.pts} pts</span>` : ''}${bd.n ? `<span class="faint">${o.left != null ? o.left + ' left' : ''}</span>` : ''}</div>
      <div class="fx">${L.join('')}</div>${o.foot || ''}
    </${tag}>`;
  }

  // ------------------------------------------------------------ town scene
  function sceneHTML(p, o) {
    o = o || {};
    const W = App.ui.narrow ? 480 : 960, cols = App.ui.narrow ? 4 : 8, cw = 120;
    const n = p.blds.length, rows = Math.ceil(n / cols), H = 205 + 58 * (rows - 1);
    let g = '';
    for (let i = 0; i < 28; i++) g += `<circle class="star" cx="${(i * 137 + 40) % W}" cy="${(i * 53) % 70 + 34}" r="${i % 3 ? 1 : 1.6}"/>`;
    if (o.dawn != null) g += `<g class="sunwrap"><circle cx="${W * .72}" cy="${H - 150}" r="78" fill="#ffb35a" opacity=".28"/><circle cx="${W * .72}" cy="${H - 150}" r="36" fill="#ffd98a"/></g>`;
    g += `<path d="M0 ${H - 70} Q ${W * .25} ${H - 125} ${W * .5} ${H - 88} T ${W} ${H - 98} V ${H} H0Z" fill="var(--hill1)"/>`;
    g += `<path d="M0 ${H - 50} Q ${W * .3} ${H - 84} ${W * .6} ${H - 60} T ${W} ${H - 68} V ${H} H0Z" fill="var(--hill2)"/>`;
    g += `<rect x="0" y="${H - 42}" width="${W}" height="42" fill="var(--ground)"/>`;
    const ty = H - 11;
    for (let x = 6; x < W; x += 16) g += `<rect x="${x}" y="${ty - 4}" width="5" height="9" fill="var(--plank)"/>`;
    g += `<line x1="0" y1="${ty - 1}" x2="${W}" y2="${ty - 1}" stroke="var(--steel2)" stroke-width="2.5"/><line x1="0" y1="${ty + 3}" x2="${W}" y2="${ty + 3}" stroke="var(--steel2)" stroke-width="2.5"/>`;
    g += `<use href="#i-rail" x="${14 + Math.min(p.advances, 10) / 10 * (W - 70)}" y="${ty - 24}" width="30" height="30"/>`;
    const shown = p.blds.map((b, i) => ({ b, i }));
    for (let r = rows - 1; r >= 0; r--) {
      const row = shown.filter(x => Math.floor(x.i / cols) === r), cnt = row.length, sx = (W - cnt * cw) / 2, base = H - 30 - r * 58;
      row.forEach((x, k) => {
        const px = sx + k * cw, py = base - 100.8, bd = BMAP[x.b.id];
        const rise = x.b.uid > App.ui.seenUid ? ' rise' : '';
        g += `<g class="bld${rise}" data-act="bld" data-id="${x.b.id}" tabindex="0" role="button" aria-label="${bd.name}">${A.sprite(x.b.id).replace('<svg ', `<svg x="${px}" y="${py}" width="120" height="108" `)}<text x="${px + 60}" y="${base + 12}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" opacity=".92" style="paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:2.5px">${bd.name}</text>${(() => { const a = (p.assign || {})[x.b.uid] || {}, n = (a.s1 || 0) + (a.s2 || 0) + (a.dbl || 0); let h = ''; for (let w = 0; w < n; w++) h += `<g class="wk"><ellipse cx="${px + 60 + (w - (n - 1) / 2) * 24}" cy="${base - 3}" rx="11" ry="3.5" fill="rgba(0,0,0,.35)"/><use href="#i-worker" x="${px + 60 + (w - (n - 1) / 2) * 24 - 14}" y="${base - 33}" width="28" height="28"/></g>`; return h; })()}</g>`;
      });
    }
    if (o.assign !== false && p.workers) {
      const used = Object.keys(p.assign || {}).reduce((a, u) => { const x = p.assign[u]; return a + (x.s1 || 0) + (x.s2 || 0) + (x.dbl || 0); }, 0);
      let wr = '';
      for (let w = 0; w < p.workers; w++) wr += `<use href="#i-worker" x="${12 + w * 32}" y="40" width="30" height="30" opacity="${w < used ? 1 : .35}"/>`;
      g += `<g data-tip="Workers: ${used} of ${p.workers} are assigned to slots. Faded workers are idle but still get paid."><rect x="6" y="36" width="${Math.max(0, p.workers * 32 + 12)}" height="38" rx="8" fill="rgba(0,0,0,.28)"/>${wr}</g>`;
    }
    return `<div class="scene${o.dawn != null ? ' dawn' : ''}"${o.dawn != null ? ` style="--d:-${o.dawn}ms"` : ''}><svg class="sc" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(poss(p.name))} town">${g}</svg>
      <div class="cap"><b>${esc(poss(p.name))} claim</b><span>${n} building${n === 1 ? '' : 's'}${p.lines ? ', ' + p.lines + ' spur line' + (p.lines > 1 ? 's' : '') : ''}</span></div></div>`;
  }

  // ------------------------------------------------------------ pay panel
  function payPanel(p, amount, o) {
    const st = App.ui.pay, sav = HS.has(p, 'savings');
    const maxG = Math.max(0, Math.min(o.maxGold != null ? o.maxGold : p.res.gold, Math.ceil(amount / 5)));
    const maxT = sav ? Math.max(0, Math.min(o.maxTrades != null ? o.maxTrades : p.trade, amount)) : 0;
    st.gold = Math.max(0, Math.min(st.gold, maxG)); st.trades = Math.max(0, Math.min(st.trades, maxT));
    while (st.gold * 5 + st.trades > amount + 4 && st.gold > 0) st.gold--;
    const sil = Math.max(0, amount - 5 * st.gold - st.trades), short = sil - p.silver;
    const step = (k, label, ic, val, max) => `<div class="stepper"><span>${ic} ${label}</span><button data-act="${k}" data-d="-1" ${val <= 0 ? 'disabled' : ''}>-</button><b class="num">${val}</b><button data-act="${k}" data-d="1" ${val >= max ? 'disabled' : ''}>+</button></div>`;
    return `<div class="pay">
      <div class="due">${o.title || 'Pay'}: ${amount} ${I('silver')}</div>
      <div class="row wrap">${step('pg', 'Gold (5 each)', I('gold'), st.gold, maxG)}${sav ? step('pt', 'Trade tokens (1 each)', I('trade'), st.trades, maxT) : ''}</div>
      <div class="row wrap"><span>From your purse: <b class="num">${sil}</b> ${I('silver')} of ${p.silver}</span></div>
      ${short > 0 ? `<div class="notice bad">Short by ${short} silver. Sell goods in the market, or borrow: each IOU gives 2 silver but costs 1, 2, 3... VP at the end.
        <div class="row wrap" style="margin-top:6px"><button class="btn small warn" data-act="debt" data-n="${Math.ceil(short / 2)}" ${App.s.sup.debt >= Math.ceil(short / 2) ? "" : "disabled"}>Borrow ${Math.ceil(short / 2)} IOU (+${Math.ceil(short / 2) * 2})</button></div></div>` : ''}
      <div class="row"><button class="btn" data-act="${o.act}" ${short > 0 || o.blocked ? 'disabled' : ''}>${o.btn || 'Pay'}</button>${o.extra || ''}</div>
    </div>`;
  }

  // ------------------------------------------------------------ rail / reward pickers
  function railTrack(p) {
    const cells = RAIL.map((k, i) => `<div class="rcell ${i < p.advances ? 'done' : ''} ${i === p.advances ? 'now' : ''}" data-tip="Rail space ${i + 1}: ${RAILNAME[k]}. ${i < p.advances ? 'You have passed this space.' : i === p.advances ? 'Your next pass lands here.' : 'Not reached yet.'} Landing here lets you take this reward or any earlier one.">${I(RAILICON[k])}<span>${RAILNAME[k]}</span></div>`).join('');
    return `<div class="rtrack">${cells}${p.advances > 5 ? `<span class="chip">+${p.advances - 5} beyond</span>` : ''}</div>`;
  }
  function rewardButtons(s, p, act, extra) {
    const ch = HS.railChoices(s, p);
    if (!ch.length) return `<div class="row"><button class="btn" data-act="${act}" data-reward="">${extra || 'Advance (no reward)'}</button></div>`;
    return `<div class="row wrap rewards">${ch.map(k => {
      if (k === 'resource') return `<span class="chip">Any resource: ${RES.filter(r => s.sup[r] > 0).map(r => `<button class="btn small ghost" data-act="${act}" data-reward="resource" data-res="${r}" data-tip="${cap(r)}">${I(r)}</button>`).join('')}</span>`;
      return `<button class="btn small" data-tip="${RAILNAME[k]}: ${RAILTIP[k]}" data-act="${act}" data-reward="${k}">${I(RAILICON[k])} ${RAILNAME[k]}</button>`;
    }).join('')}</div>`;
  }

  // ------------------------------------------------------------ phase panels
  function tileBonusChips(t) {
    if (t.noBuild) return `<span class="chip">No building</span>${outChips(t.bonus)}`;
    return outChips(t.bonus);
  }
  function assignPanel(s, p) {
    const used = Object.keys(p.assign).reduce((a, u) => { const x = p.assign[u]; return a + (x.s1 || 0) + (x.s2 || 0) + (x.dbl || 0); }, 0);
    const g = HS.incomeOf(s, p, p.assign);
    const chips = [];
    ['silver', 'trade', 'vp', ...RES].forEach(k => { if (g[k]) chips.push(`<span class="chip">${I(k)}+${g[k]}</span>`); });
    if (g.debtPay) chips.push(`<span class="chip">${I('debt')} repay ${Math.min(p.debt, g.debtPay)}</span>`);
    const cards = p.blds.filter(b => HS.slotsOf(BMAP[b.id]).length || BMAP[b.id].auto).map(b => {
      const bd = BMAP[b.id], a = p.assign[b.uid] || {};
      const slots = HS.slotsOf(bd).map(k => {
        const cap2 = HS.slotCap(k), on = (a[k] || 0) >= cap2;
        const dots = Array.from({ length: cap2 }, () => `<span class="w ${on ? 'on' : ''}">${on ? I('worker') : ''}</span>`).join('');
        return `<button class="slot ${on ? 'full' : ''}" data-tip="${on ? 'Click to take your worker' + (cap2 > 1 ? 's' : '') + ' off.' : 'Click to send ' + cap2 + ' worker' + (cap2 > 1 ? 's' : '') + ' here.'} Pays: ${outText(bd[k])}." data-act="slot" data-uid="${b.uid}" data-k="${k}" aria-pressed="${on}">${dots}${outChips(bd[k])}</button>`;
      }).join('');
      return `<div class="bcard" data-id="${b.id}"><div class="art">${A.sprite(b.id)}</div><div class="nm"><span>${bd.name}</span><span class="ty ${bd.type}">${I(bd.type)}</span></div>
        ${bd.auto ? `<div class="fx">Always: ${outChips(bd.auto)}</div>` : ''}<div class="slots">${slots}</div></div>`;
    }).join('');
    return `<div class="table"><div class="hd"><h2>${s.final ? 'Final income' : 'Assign your workers'}</h2>
      <span class="muted">${I('worker')} <b class="num">${used}</b> of ${p.workers} working. Wages: ${p.workers} ${I('silver')} (idle workers are paid too).</span></div>
      <p class="hint">${s.final ? 'One last harvest before the ledger closes.' : 'Tap a slot to put a worker there. Everyone assigns in secret, then income is collected.'}</p>
      <div class="cards">${cards}</div>
      <div class="notice">This round you collect: ${chips.join(' ') || 'nothing yet'} <span class="faint">(plus ${p.lines} from spur lines included)</span></div>
      <div class="row wrap"><button class="btn" data-act="ready">Ready</button><button class="btn ghost" data-act="suggest">Suggest</button><button class="btn ghost" data-act="clear">Clear</button></div></div>`;
  }
  function bidPanel(s, p) {
    const myTurn = s.bidTurn === p.id;
    const advise = s.opts.advisor;
    const aucs = s.auctions.map(a => {
      const t = a.tile, legal = HS.legalBids(s, p.id, a.idx);
      const holder = a.holder === 'N' ? 'Neutral bidder' : a.holder == null ? '' : a.holder === p.id ? 'You' : s.players[a.holder].name;
      const mini = t.noBuild ? '' : HS.eligible(s, t).map(id => {
        const q = HS.quoteBuild(s, p, id);
        return `<span class="mb ${q.ok ? 'ok' : 'no'}" data-act="bld" data-id="${id}">${A.sprite(id)}${BMAP[id].name}</span>`;
      }).join('') || '<span class="faint">No buildings available</span>';
      let adv = '';
      if (advise && !t.noBuild || advise && t.noBuild) { const r = B.advise(s, p.id, a.idx, 2); if (r) adv = `<div class="faint">Advisor: worth about ${Math.max(0, r.worth)} silver${r.id ? ' (' + BMAP[r.id].name + ')' : ''}</div>`; }
      const lad = LADDER.filter(x => x >= Math.max(3, a.bid)).map(x => `<button class="lad" data-tip="${myTurn && legal.includes(x) ? 'Bid ' + x + ' silver on ' + esc(t.name) + '. You pay only if you win. If you are outbid you bid again.' : myTurn ? 'Not allowed: you must beat the current bid, and you must be able to build here.' : 'Wait for your turn.'}" data-act="bid" data-a="${a.idx}" data-amt="${x}" ${myTurn && legal.includes(x) ? '' : 'disabled'}>${x}</button>`).join('');
      return `<div class="auc ${a.holder === p.id ? 'mine' : ''}"><div class="tn" data-tip="${esc(t.name)}: the winner may ${t.noBuild ? 'not build, but takes the bonus' : 'build a ' + t.types.map(x => D.TYPES[x]).join(' or ') + ' building'}. Bonus when won: ${t.bonus ? outText(t.bonus) : 'none'}.${a.idx === 0 ? ' Winning this auction also gives you the start marker.' : ''}">${t.name} <span class="faint">${a.idx === 0 ? '(start marker)' : ''}</span></div>
        <div class="row wrap">${t.types.map(typeChip).join('')}${tileBonusChips(t)}</div>
        <div class="bidnow">${a.bid ? `<span class="coin ${a.holder === 'N' ? 'neutral' : ''} stamp" key="${a.bid}">${a.bid}</span><span>${holder}</span>` : '<span class="faint">No bids yet</span>'}</div>
        <div class="mini">${mini}</div>${adv}
        ${!t.noBuild && !HS.canBuildAny(s, p, t) ? '<div class="faint">You cannot afford to build here.</div>' : ''}
        <div class="ladder">${lad}</div></div>`;
    }).join('');
    return `<div class="table"><div class="hd"><h2>Auctions</h2><span class="muted">${myTurn ? 'Your turn: bid or pass.' : 'Waiting for ' + esc(s.bidTurn != null && s.players[s.bidTurn] ? s.players[s.bidTurn].name : 'the next bidder') + '. You can still watch the auctions.'}</span></div>
      <p class="hint">Raise a bid to take the lead; if you are outbid you get to bid again. Winning an auction lets you build. Passing moves you along the rail but ends your bidding this round.</p>
      <div class="aucs">${aucs}</div>
      ${myTurn ? `<div class="panel" data-tip="Passing ends your bidding this round, but moves you along the rail for a reward. Wages are already paid, so passing never costs silver."><h3>${I('rail')} Pass and advance the railroad</h3>${railTrack(p)}<p class="hint">Next space gives: ${HS.railChoices(s, p).map(k => RAILNAME[k]).join(', ') || 'nothing'}.</p>${rewardButtons(s, p, 'pass', 'Pass (no reward)')}</div>` : ''}</div>`;
  }
  // material costs against what the player holds: icon have/need, red when short
  function needChips(q, p) {
    const L = RES.filter(r => q.need[r] > 0).map(r => { const h = p.res[r] || 0, ok = h >= q.need[r];
      return `<span class="nc ${ok ? 'ok' : 'short'}" data-tip="${cap(r)}: need ${q.need[r]}, you have ${h}${ok ? '' : '. You can buy the rest with trade tokens.'}">${I(r)}<b>${h}/${q.need[r]}</b></span>`; });
    return L.length ? `<div class="needs"><span class="faint">Materials (have/need)</span>${L.join('')}</div>` : '<div class="needs faint">No materials needed</div>';
  }
  function buildPanel(s, p, st, extra) {
    const auc = s.auctions[st.auction];
    const ids = HS.eligible(s, auc.tile, extra);
    const sel = App.ui.sel && ids.includes(App.ui.sel) ? App.ui.sel : null;
    const cards = ids.map(id => {
      const q = HS.quoteBuild(s, p, id);
      return bcard(id, { tag: 'button', cls: (sel === id ? 'sel ' : '') + (q.ok ? '' : 'dis'), attrs: `data-act="pick" data-id="${id}"`, left: s.bsup[id],
        foot: needChips(q, p) + `<div class="${q.ok ? 'faint' : ''}" style="font-size:13px">${q.ok ? (q.T ? `Buys goods: ${q.T} trade, ${q.S} silver` : 'You have everything') : '<span style="color:var(--bad)">' + q.why + '</span>'}</div>` });
    }).join('');
    let pay = '';
    if (sel) {
      const q = HS.quoteBuild(s, p, sel);
      const extraBid = extra && s.opts.trainExtra === 'bid' ? st.bid : 0, total = q.S + extraBid;
      const goldFree = Math.max(0, p.res.gold + q.buy.gold - q.need.gold - q.goldCL);
      const buys = ['wood', 'food', 'steel', 'gold'].filter(r => q.buy[r]).map(r => `${q.buy[r]} ${r}`).concat(['copper', 'livestock'].filter(r => q.clBuy[r]).map(r => `${q.clBuy[r]} ${r} (1 gold each)`));
      pay = `<div class="notice">${needChips(q, p)}${BMAP[sel].name}: ${buys.length ? 'you will buy ' + buys.join(', ') + ' using ' + q.T + ' trade token' + (q.T > 1 ? 's' : '') + ' and ' + q.S + ' silver' : 'paid from your stock'}${extraBid ? ', plus the bid again (' + extraBid + ')' : ''}.${q.landingPaid.copper + q.landingPaid.livestock ? ' River Landing: gold stands in for copper or livestock.' : ''}</div>`
        + payPanel(p, total, { act: 'buildGo', title: 'Silver for the build', btn: 'Build ' + BMAP[sel].name, maxGold: goldFree, maxTrades: p.trade - q.T, blocked: !q.ok });
    }
    return `<div class="table"><div class="hd"><h2>${extra ? 'Extra building' : 'Build on ' + auc.tile.name}</h2><span class="muted">${extra ? 'Junction Depot lets you build one more of any type.' : 'Choose a ' + auc.tile.types.map(t => D.TYPES[t]).join(' or ') + ' building.'}</span></div>
      <div class="cards">${cards}</div>${pay}${extra ? '<div class="row"><button class="btn ghost" data-act="skipExtra">Skip the extra building</button></div>' : ''}</div>`;
  }
  function resolvePanel(s, p) {
    const st = s.steps[0], auc = st.auction != null ? s.auctions[st.auction] : null;
    if (st.k === 'payBid') return `<div class="table"><div class="hd"><h2>You won ${auc.tile.name}</h2></div><p class="hint">Pay your winning bid. You can use gold, sell goods, or borrow.</p>${payPanel(p, st.amount, { act: 'payBid', title: 'Winning bid', btn: 'Pay ' + st.amount })}</div>`;
    if (st.k === 'build') return buildPanel(s, p, st, false);
    if (st.k === 'extra') return buildPanel(s, p, st, true);
    if (st.k === 'rail') return `<div class="table"><div class="hd"><h2>Advance on the rail</h2></div>${railTrack(p)}<p class="hint">Choose your reward.</p>${rewardButtons(s, p, 'railReward')}</div>`;
    if (st.k === 'pickRes') return `<div class="table"><div class="hd"><h2>Take a resource</h2></div><div class="row wrap">${RES.filter(r => s.sup[r] > 0).map(r => `<button class="btn" data-act="pickRes" data-res="${r}">${I(r)} ${cap(r)}</button>`).join('')}</div></div>`;
    return '';
  }
  function finalPanel(s, p) {
    const sc = HS.scoreOf(s, p);
    return `<div class="table"><div class="hd"><h2>Final accounts</h2><span class="muted">Last chance to trade and settle.</span></div>
      <p class="hint">Gold, copper and livestock are worth 2 VP each at the end, so selling them costs points even though each sale gives 1 VP. Debt costs 1, 2, 3... VP. Silver only breaks ties.</p>
      <div class="stats"><div class="stat"><b>${I('vp')}${sc.total}</b><span>Score now</span></div><div class="stat"><b>${sc.rarePts}</b><span>From ${sc.rare} rare goods</span></div><div class="stat ${sc.pen ? 'bad' : ''}"><b>${-sc.pen}</b><span>Debt penalty</span></div><div class="stat"><b>${sc.bonus}</b><span>Building bonuses</span></div></div>
      <div class="row"><button class="btn" data-act="finalDone">Close the ledger</button></div></div>`;
  }
  // read-only view of the auctions while another player resolves theirs (pays, builds, takes a rail reward)
  function watchPanel(s, p) {
    const who = HS.needs(s).map(x => s.players[x.p].name).filter((n, i, a) => a.indexOf(n) === i);
    const cur = s.steps[0], now = cur && cur.auction != null ? s.auctions[cur.auction] : null;
    const what = cur ? ({ payBid: 'paying for', build: 'choosing a building on', extra: 'choosing an extra building', rail: 'advancing on the rail', pickRes: 'picking a resource' }[cur.k] || 'resolving') : 'resolving';
    const cards = s.auctions.map(a => {
      const t = a.tile, holder = a.holder === 'N' ? 'Neutral bidder' : a.holder == null ? 'No bids' : a.holder === p.id ? 'You' : s.players[a.holder].name;
      return `<div class="auc ${a.holder === p.id ? 'mine' : ''}"><div class="tn">${esc(t.name)}</div><div class="row wrap">${t.types.map(typeChip).join('')}${tileBonusChips(t)}</div><div class="bidnow">${a.bid ? `<span class="coin ${a.holder === 'N' ? 'neutral' : ''}">${a.bid}</span><span>${holder}</span>` : '<span class="faint">No bids</span>'}</div>${now && now.idx === a.idx ? '<div class="faint">Resolving now</div>' : ''}</div>`;
    }).join('');
    return `<div class="table"><div class="hd"><h2>Auctions</h2><span class="muted">Waiting for ${esc(who.join(' and ') || 'the next step')}${cur && cur.k !== 'rail' && cur.k !== 'pickRes' && now ? ' (' + what + ' ' + esc(now.tile.name) + ')' : ''}.</span></div><p class="hint">The bidding is over. Winners now pay and build one at a time. Moves appear here as soon as they happen.</p><div class="aucs">${cards}</div></div>`;
  }

  // ---- buildings chart (under the player's town): own buildings or the whole set, sortable by every stat
  const BTYPE_ORD = { R: 0, I: 1, C: 2, S: 3 }, BERA_ORD = { '-': 0, A: 1, 'A/B': 2, B: 3, C: 4 };
  const outSum = o => o ? Object.keys(o).reduce((t, k) => t + (typeof o[k] === 'number' ? o[k] : 1), 0) : 0;
  const BSORT = {
    name: b => b.name, type: b => BTYPE_ORD[b.type] * 100, era: b => BERA_ORD[b.era] == null ? 9 : BERA_ORD[b.era],
    cost: b => b.costList.length, pts: b => b.pts || 0, income: b => outSum(b.auto),
    slots: b => (b.s1 ? 1 : 0) + (b.s2 ? 1 : 0) + (b.dbl ? 1 : 0),
  };
  const BSORT_LABEL = [['name', 'Name'], ['type', 'Type'], ['era', 'Era'], ['cost', 'Cost'], ['pts', 'Points'], ['income', 'Income'], ['slots', 'Worker slots']];
  function bldTablePanel(s, v) {
    const view = App.ui.bview || 'mine', bs = App.ui.bs || { k: 'era', d: 1 };
    const counts = {}; v.blds.forEach(b => { counts[b.id] = (counts[b.id] || 0) + 1; });
    let list = view === 'all' ? D.BUILDINGS.slice() : Object.keys(counts).map(id => BMAP[id]);
    const key = BSORT[bs.k];
    list.sort((a, b) => { const x = key(a), y = key(b); const c = typeof x === 'string' ? x.localeCompare(y) : x - y; return (c || a.name.localeCompare(b.name)) * bs.d; });
    const btns = BSORT_LABEL.map(([k, l]) => `<button class="${bs.k === k ? 'on' : ''}" data-act="bsort" data-k="${k}" aria-pressed="${bs.k === k}" data-tip="Sort by ${l.toLowerCase()}. Click again to reverse.">${l}${bs.k === k ? (bs.d > 0 ? ' &#9650;' : ' &#9660;') : ''}</button>`).join('');
    const rows = list.map(bd => {
      const n = counts[bd.id] || 0;
      const slots = [bd.s1 ? `<div><span class="faint">1 worker</span> ${outChips(bd.s1)}</div>` : '', bd.s2 ? `<div><span class="faint">1 worker</span> ${outChips(bd.s2)}</div>` : '', bd.dbl ? `<div><span class="faint">2 workers</span> ${outChips(bd.dbl)}</div>` : ''].join('');
      const notes = [bd.onBuild ? `<div><span class="faint">When built</span> ${outChips(bd.onBuild)}</div>` : '', ...(bd.final || []).map(f => `<div><span class="faint">Final</span> ${finalTxt(f)}</div>`), bd.special ? `<div class="faint">${SPECIAL[bd.special]}</div>` : ''].join('');
      return `<tr class="${n ? 'own' : ''}" data-act="bld" data-id="${bd.id}"><td class="bn"><span class="th">${A.sprite(bd.id)}</span><span>${bd.name}${n > 1 ? ' <b>&times;' + n + '</b>' : ''}${view === 'all' && n ? ' <span class="tag confirmed">owned</span>' : ''}</span></td>
        <td><span class="ty ${bd.type}">${I(bd.type)}${bd.type}</span></td><td>${ERA[bd.era] ? bd.era : 'Start'}</td><td>${costHTML(bd)}</td><td class="num">${bd.pts || ''}</td>
        <td>${outChips(bd.auto)}</td><td>${slots}</td><td>${notes}</td>${view === 'all' ? `<td class="num">${bd.id === 'cabin' ? '' : s.bsup[bd.id] != null ? s.bsup[bd.id] : 0}</td>` : ''}</tr>`;
    }).join('');
    return `<div class="panel btable"><h3>Your buildings <span class="faint" style="font-weight:500;font-size:13px">${view === 'all' ? 'All ' + list.length + ' in the game' : v.blds.length + ' built'}</span></h3>
      <div class="row wrap" style="justify-content:space-between;gap:8px"><div class="seg" role="group" aria-label="Which buildings"><button class="${view === 'mine' ? 'on' : ''}" data-act="bview" data-v="mine">Mine</button><button class="${view === 'all' ? 'on' : ''}" data-act="bview" data-v="all">All buildings</button></div>
      <div class="sortbar" role="group" aria-label="Sort buildings"><span class="faint">Sort by</span>${btns}</div></div>
      <div class="tblwrap"><table class="bt"><thead><tr><th>Building</th><th>Type</th><th>Era</th><th>Cost</th><th>Points</th><th>Always</th><th>Worker slots</th><th>Notes</th>${view === 'all' ? '<th>Left</th>' : ''}</tr></thead><tbody>${rows || '<tr><td colspan="8" class="faint">No buildings yet.</td></tr>'}</tbody></table></div></div>`;
  }
  function tablePanel(s, p) {
    const c = curNeed();
    if (!c && s.phase === 'bid') return bidPanel(s, p);
    if (!c && s.phase === 'resolve') return watchPanel(s, p);
    if (!c) {
      const who = HS.needs(s).map(x => s.players[x.p].name).filter((n, i, a) => a.indexOf(n) === i);
      return `<div class="table"><div class="hd"><h2>Waiting</h2></div><p class="hint">${who.length ? 'Waiting for ' + esc(who.join(' and ')) + '.' : 'Working...'} ${App.net ? 'Moves sync as soon as everyone has chosen.' : ''}</p></div>`;
    }
    switch (s.phase) {
      case 'assign': return assignPanel(s, p);
      case 'wages': return `<div class="table"><div class="hd"><h2>Wages</h2></div><p class="hint">Every worker costs 1 silver, working or not. A gold cube pays for up to five.</p>${payPanel(p, p.workers, { act: 'payWages', title: 'Wages', btn: 'Pay wages' })}</div>`;
      case 'neutralPick': return `<div class="table"><div class="hd"><h2>Place the neutral bid</h2></div><p class="hint">The neutral bidder opens at ${HS.neutralValue(s)} on one auction.</p><div class="row wrap">${s.auctions.map(a => `<button class="btn" data-act="neutral" data-a="${a.idx}">${a.tile.name}</button>`).join('')}</div></div>`;
      case 'bid': return bidPanel(s, p);
      case 'resolve': return resolvePanel(s, p);
      case 'finalTrade': return finalPanel(s, p);
    }
    return '';
  }

  // ------------------------------------------------------------ side panels
  function marketPanel(s, p, on) {
    const TC = `<span class="tc" aria-label="costs 1 trade token">&minus;1${I('trade')}</span>`;
    const rows = RES.map(r => {
      const cl = r === 'copper' || r === 'livestock';
      const price = cl ? `1 ${I('gold')}` : `${PRICE[r]} ${I('silver')}`;
      const canBuy = on && p.trade >= 1 && s.sup[r] > 0 && (cl ? p.res.gold >= 1 : p.silver >= PRICE[r]);
      const canSell = on && p.trade >= 1 && p.res[r] >= 1 && (!cl || s.sup.gold >= 1);
      const why = (what) => !on ? 'Not your decision right now.' : p.trade < 1 ? 'You need a trade token.' : what;
      const buyWhy = canBuy ? 'Buy 1 ' + r + ' for ' + (cl ? '1 gold' : PRICE[r] + ' silver') + ' and spend 1 trade token (it is used up, not gained).' : why(s.sup[r] <= 0 ? 'The supply of ' + r + ' is empty.' : cl ? 'You need a gold to pay.' : 'You need ' + PRICE[r] + ' silver.');
      const sellWhy = canSell ? 'Sell 1 ' + r + ' for ' + (cl ? '1 gold' : PRICE[r] + ' silver') + (HS.has(p, 'drygoods') && !cl ? ' (+1 from Dry Goods)' : '') + '. Spends 1 trade token (not gained). Scores 1 VP.' : why(p.res[r] < 1 ? 'You have none to sell.' : 'No gold left in the supply.');
      const sellGet = cl ? `+1 ${I('gold')}` : `+${PRICE[r] + (HS.has(p, 'drygoods') ? 1 : 0)} ${I('silver')}`, stock = s.sup[r] > 900 ? 100 : Math.min(100, s.sup[r] / 14 * 100);
      return `<div class="mrow ${p.res[r] ? 'has' : ''}"><div class="mico">${I(r)}</div>
        <div class="minfo"><b>${cap(r)}</b><span class="faint">${s.sup[r] > 900 ? 'plenty in supply' : s.sup[r] + ' in supply'}</span><i class="bar" aria-hidden="true"><u style="width:${stock}%"></u></i></div>
        <div class="mhave" data-tip="You hold ${p.res[r]} ${r}."><span class="num">${p.res[r]}</span><span class="faint">yours</span></div>
        <div class="mk"><button data-tip="${buyWhy}" data-act="buy" data-r="${r}" ${canBuy ? '' : 'disabled'}><span class="mv">Buy</span><span class="mp">&minus;${price}</span>${TC}</button><button data-tip="${sellWhy}" data-act="sell" data-r="${r}" ${canSell ? '' : 'disabled'}><span class="mv">Sell</span><span class="mp">${sellGet}</span>${TC}</button></div></div>`;
    }).join('');
    const extras = [];
    extras.push(`<button class="btn small ghost" data-tip="Hire a worker: spends 1 trade token and 1 food. Every worker costs 1 silver in wages each round, so only hire if you have a slot for them." data-act="hire" ${on && p.trade >= 1 && p.res.food >= 1 && s.sup.worker > 0 ? '' : 'disabled'}>Hire worker (&minus;1${I('trade')} &minus;1${I('food')})</button>`);
    if (HS.has(p, 'bazaar')) {
      extras.push(`<button class="btn small ghost" data-tip="Bazaar: spend 1 trade token (not gained) to turn 1 wood into 1 food." data-act="convert" data-from="wood" ${on && p.trade >= 1 && p.res.wood >= 1 && s.sup.food > 0 ? '' : 'disabled'}>Wood to food ${TC}</button>`);
      extras.push(`<button class="btn small ghost" data-tip="Bazaar: spend 1 trade token (not gained) to turn 1 food into 1 steel." data-act="convert" data-from="food" ${on && p.trade >= 1 && p.res.food >= 1 && s.sup.steel > 0 ? '' : 'disabled'}>Food to steel ${TC}</button>`);
    }
    extras.push(`<button class="btn small ghost" data-tip="Borrow: take 1 IOU and 2 silver now. Unpaid IOUs cost 1, 2, 3... VP in total at the end, so the second one hurts more." data-act="debt" data-n="1" ${on && s.sup.debt > 0 ? '' : 'disabled'}>Take IOU (+2 ${I('silver')})</button>`);
    extras.push(`<button class="btn small ghost" data-tip="Repay 1 IOU for 5 silver." data-act="repay" data-gold="0" ${on && p.debt >= 1 && p.silver >= 5 ? '' : 'disabled'}>Repay (5 ${I('silver')})</button>`);
    extras.push(`<button class="btn small ghost" data-tip="Repay 1 IOU with 1 gold cube." data-act="repay" data-gold="1" ${on && p.debt >= 1 && p.res.gold >= 1 ? '' : 'disabled'}>Repay (1 ${I('gold')})</button>`);
    return `<div class="panel market"><h3>Market</h3><div class="mhead"><div class="mbal"><span class="ml">Trade tokens</span><b class="num">${I('trade')}${p.trade}</b></div><div class="mbal"><span class="ml">Silver</span><b class="num">${I('silver')}${p.silver}</b></div><div class="mbal"><span class="ml">Gold</span><b class="num">${I('gold')}${p.res.gold}</b></div></div><div class="notice tnote">Every buy, sell, hire or conversion <b>spends</b> 1 ${I('trade')} trade token. You never gain tokens by trading. Each sale also scores 1 ${I('vp')} VP.</div><div class="mrows">${rows}</div><div class="mxh">Other actions</div><div class="row wrap">${extras.join('')}</div></div>`;
  }
  function ledgerPanel(s, p) {
    const sc = HS.scoreOf(s, p);
    return `<div class="panel"><h3>${esc(poss(p.name))} ledger</h3><div class="stats">
      <div class="stat"><b>${I('silver')}<span class="num">${p.silver}</span></b><span>Silver</span></div>
      <div class="stat"><b>${I('trade')}<span class="num">${p.trade}</span></b><span>Trade tokens</span></div>
      <div class="stat"><b>${I('vp')}<span class="num">${p.vp}</span></b><span>VP chits</span></div>
      <div class="stat"><b>${I('worker')}<span class="num">${p.workers}</span></b><span>Workers</span></div>
      <div class="stat"><b>${I('line')}<span class="num">${p.lines}</span></b><span>Spur lines</span></div>
      <div class="stat ${p.debt ? 'bad' : ''}"><b>${I('debt')}<span class="num">${p.debt}</span></b><span>IOUs</span></div></div>
      <div class="goods-h">Goods</div><div class="stats goods">${RES.map(r => `<div class="stat ${p.res[r] ? '' : 'zero'}" data-tip="${cap(r)}: ${p.res[r]}"><b>${I(r)}<span class="num">${p.res[r]}</span></b><span>${cap(r)}</span></div>`).join('')}</div>
      <p class="faint" style="margin:8px 0 0">Score if the game ended now: <b class="num" style="color:var(--ink)">${sc.total}</b></p></div>`;
  }
  function lotsPanel(s) {
    const groups = { R: [], I: [], C: [], S: [] };
    Object.keys(s.bsup).forEach(id => { if (s.bsup[id] > 0) groups[BMAP[id].type].push(id); });
    const grp = t => groups[t].length ? `<div class="grp"><b>${I(t)} ${D.TYPES[t]}</b>${groups[t].map(id => `<button class="lotrow" data-act="bld" data-id="${id}">${A.sprite(id)}<span>${BMAP[id].name} <span class="era">${costHTML(BMAP[id])}</span></span><span class="num">x${s.bsup[id]}</span></button>`).join('')}</div>` : '';
    const nextKey = s.round < 5 ? 'B' : s.round < 9 ? 'C' : null;
    const next = nextKey ? Object.keys(s.reserve[nextKey]).map(id => BMAP[id].name).join(', ') : '';
    const sup = RES.map(r => `<span class="chip">${I(r)}${s.sup[r] > 900 ? '∞' : s.sup[r]}</span>`).join('') + `<span class="chip">${I('trade')}${s.sup.trade}</span><span class="chip">${I('worker')}${s.sup.worker}</span><span class="chip">${I('debt')}${s.sup.debt}</span>`;
    return `<div class="panel lots"><h3>Lots for sale</h3>${grp('R')}${grp('I')}${grp('C')}${grp('S')}
      ${nextKey ? `<p class="faint" style="margin:0 0 8px">Round ${nextKey === 'B' ? 5 : 9} brings: ${next}.</p>` : ''}<h3 style="font-size:15px">Supply</h3><div class="row wrap" style="gap:4px">${sup}</div></div>`;
  }
  function logPanel(s) {
    return `<div class="panel"><h3>Log</h3><div class="log" id="logbox">${s.log.slice(-40).map(l => `<div>${esc(l)}</div>`).join('')}</div></div>`;
  }

  // ------------------------------------------------------------ game screen
  function topBar(s) {
    const st = s.round <= 4 ? 'A' : s.round <= 8 ? 'B' : 'C';
    const stakes = Array.from({ length: 10 }, (_, i) => { const r = i + 1; const k = r <= 4 ? 'A' : r <= 8 ? 'B' : 'C'; const stk = r === 5 ? ' Town buildings open and unbuilt Settlement-only lots are cleared.' : r === 9 ? ' City buildings open and every unbuilt lot is cleared.' : r === 10 ? ' The last round, then a final income and settle-up.' : '';
      return `<div class="stake ${k} ${r < s.round || (r === s.round && s.over) ? 'done' : ''} ${r === s.round && !s.over ? 'now' : ''}" data-tip="Round ${r} of 10, ${STAGE[k]} stage.${stk}">${r}</div>`; }).join('');
    const title = { assign: s.final ? 'Final income' : 'Assign workers', wages: 'Wages', bid: 'Auctions', resolve: 'Building', finalTrade: 'Final accounts', neutralPick: 'Neutral bid', over: 'Game over' }[s.phase] || '';
    return `<div class="top"><div class="brand">${I('stake')}Claimstake</div>
      <div class="ribbon">${stakes}<div class="stagebar"><span>Settlement</span><span>Town</span><span>City</span></div></div>
      <div class="col" style="gap:0;text-align:right"><span class="phase">${title}</span><span class="faint">Round ${s.round} of 10, ${STAGE[st]}</span></div>
      <div class="row"><button class="iconbtn" data-act="sound" data-tip="Sound" aria-label="Toggle sound">${prof.sound ? '♪' : '♩'}</button><button class="iconbtn" data-act="theme" data-tip="Theme" aria-label="Toggle theme">◐</button><button class="iconbtn" data-act="gmenu" data-tip="Menu" aria-label="Menu">≡</button></div></div>`;
  }
  function oppsStrip(s, v) {
    const c = curNeed();
    return `<div class="opps">${s.players.filter(p => p.id !== v.id).map(p => {
      const rail = Array.from({ length: 5 }, (_, i) => `<i class="${i < p.advances ? 'on' : ''}"></i>`).join('');
      const hid = s.opts.hiddenInfo !== false;
      const res = hid ? '' : RES.filter(r => p.res[r]).map(r => `<span>${I(r)}${p.res[r]}</span>`).join('');
      const status = s.phase === 'bid' ? (p.passed ? 'passed' : p.hasBid ? 'leading' : '') : '';
      return `<div class="opp ${c && c.p === p.id ? 'turn' : ''}" data-act="opp" data-p="${p.id}" role="button" tabindex="0"><div class="nm"><span><span style="color:${PCOL[p.id]}">●</span> ${esc(p.name)}</span><span class="faint">${p.kind === 'bot' ? LVL[p.level] : 'Human'}${status ? ', ' + status : ''}</span></div>
        <div class="st">${hid ? '' : `<span>${I('silver')}${p.silver}</span>`}<span>${I('vp')}${p.vp}</span><span>${I('worker')}${p.workers}</span>${hid ? '' : `<span>${I('trade')}${p.trade}</span>`}${p.debt ? `<span style="color:var(--bad)">${I('debt')}${p.debt}</span>` : ''}<span>${p.blds.length} bld</span></div>
        <div class="st">${hid ? '<span class="faint" data-tip="Silver, goods and trade tokens are hidden until the game ends.">money and goods hidden</span>' : res || '<span class="faint">no goods</span>'}<span class="pips" data-tip="Rail track: ${p.advances} of 5 spaces passed.">${rail}</span></div></div>`;
    }).join('')}</div>`;
  }
  function renderGame() {
    const s = App.s, c = curNeed(), humans = s.players.filter(p => p.kind === 'human');
    if (s.over) return renderOver();
    if (!App.net && humans.length > 1 && c && App.ui.curtainFor !== c.p) {
      const pl = s.players[c.p];
      return `<div class="veil curtain"><div class="sheet"><h1 style="font-size:36px">Pass the screen to ${esc(pl.name)}</h1><p class="muted">Other players, look away. ${esc(pl.name)}: your secrets stay hidden until you continue.</p><div><button class="btn" data-act="curtain" data-p="${pl.id}">I am ${esc(pl.name)}</button></div></div></div>`;
    }
    const v = viewer(), on = !!c && c.p === v.id && s.phase !== 'neutralPick';
    const key = s.phase + ':' + s.round + ':' + s.wageQueue.length + ':' + s.bidTurn + ':' + (s.steps[0] ? JSON.stringify(s.steps[0]) : '') + ':' + v.id;
    if (key !== App.ui.payKey) { App.ui.payKey = key; App.ui.pay = { gold: 0, trades: 0 }; App.ui.sel = null; }
    if (s.round !== App.ui.lastRound) { App.ui.lastRound = s.round; App.ui.dawnAt = Date.now(); }
    const dEl = Date.now() - (App.ui.dawnAt || 0), dawn = dEl < 2600 ? Math.max(0, Math.round(dEl)) : null;
    const dawnHTML = dawn == null ? '' : `<div class="dawnveil" style="--d:-${dawn}ms"></div><div class="dawntitle" style="--d:-${dawn}ms"><small>${STAGE[s.round <= 4 ? 'A' : s.round <= 8 ? 'B' : 'C']}</small><b>Round ${s.round}</b></div>`;
    const tab = App.ui.tab, pane = (id, html) => `<section class="pane ${tab === id ? 'on' : ''}" data-pane="${id}">${html}</section>`;
    return `${dawnHTML}<div class="top-wrap">${topBar(s)}</div>${oppsStrip(s, v)}
      <div class="main"><div class="col">${pane('play', tablePanel(s, v))}${pane('town', sceneHTML(v, { dawn }) + bldTablePanel(s, v))}</div>
      <div class="col">${pane('market', ledgerPanel(s, v) + marketPanel(s, v, on))}${pane('lots', lotsPanel(s) + logPanel(s))}</div></div>
      <nav class="tabs">${[['play', 'Play'], ['town', 'Town'], ['market', 'Market'], ['lots', 'Lots']].map(t => `<button class="${tab === t[0] ? 'on' : ''}" data-act="tab" data-t="${t[0]}">${t[1]}</button>`).join('')}</nav>`;
  }

  // ------------------------------------------------------------ scoring screen
  function renderOver() {
    const s = App.s, res = s.result, sc = res.scores;
    const hdr = s.players.map(p => `<th>${esc(p.name)}</th>`).join('');
    const cell = (f, cls) => s.players.map((p, i) => `<td class="${cls ? cls(i) : ''}">${f(sc[i], p)}</td>`).join('');
    const win = i => res.winners.includes(i) ? 'win' : '';
    const winNames = res.winners.map(i => esc(s.players[i].name)).join(' and ');
    const humans = s.players.filter(p => p.kind === 'human');
    const iWon = humans.length === 1 && res.winners.includes(humans[0].id);
    const bonuses = s.players.map((p, i) => `<td>${sc[i].items.map(x => `${x.name}: ${x.count}`).join('<br>') || '<span class="faint">none</span>'}</td>`).join('');
    const ach = (s.unlocked || []).map(id => ACH.find(a => a[0] === id)).filter(Boolean);
    return `<div class="top"><div class="brand">${I('stake')}Claimstake</div></div>
      <div class="panel" style="display:grid;gap:14px"><div class="banner">${res.winners.length > 1 ? 'Shared win: ' : ''}${winNames} ${res.winners.length > 1 ? '' : 'wins'}</div>
      ${iWon ? '<p class="muted" style="text-align:center;margin:0">The ledger is closed in your favour.</p>' : ''}
      <div class="tblwrap"><table class="scoretbl"><thead><tr><th></th>${hdr}</tr></thead><tbody>
        <tr><td data-tip="Victory points collected during play from selling goods, rewards, tiles and buildings.">VP chits</td>${cell(x => x.vp, win)}</tr>
        <tr><td data-tip="Printed points on each building you own.">Building points</td>${cell(x => x.bldPts, win)}</tr>
        <tr><td data-tip="Final scoring printed on buildings, such as 1 VP per Industrial building.">Building bonuses</td>${cell(x => x.bonus, win)}</tr>
        <tr><td class="faint">How the bonuses were earned</td>${bonuses}</tr>
        <tr><td data-tip="Each gold, copper or livestock you still hold scores 2 VP.">Gold, copper, livestock (2 each)</td>${cell(x => x.rare + ' = ' + x.rarePts, win)}</tr>
        <tr><td data-tip="Unpaid IOUs cost 1, 2, 3... VP in total.">Debt penalty</td>${cell(x => (x.debt ? x.debt + ' IOU = ' : '') + (-x.pen), win)}</tr>

  function launch(daily) {
    const m = App.menu, players = [];

    else {
      const seats = m.seats.slice(0, m.n).map(x => Object.assign({}, x));
      if (!seats.some(x => x.kind === 'human')) seats[0].kind = 'human';
      let b = 0;
      seats.forEach((x, i) => players.push(x.kind === 'human' ? { name: (x.name || 'Player ' + (i + 1)).trim() || 'Player ' + (i + 1), kind: 'human' } : { name: BOTNAMES[b++ % 3], kind: 'bot', level: x.kind }));
    }
    const opts = daily ? HS.defaultOpts() : Object.assign(HS.defaultOpts(), m.opts);
    const ds = todayStr();
    const seed = daily ? 'daily-' + ds : (m.seed.trim() || String(Date.now()));
    prof.last = { menu: { n: m.n, seats: m.seats, opts: m.opts, seed: m.seed } }; saveProf();
